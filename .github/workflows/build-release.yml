name: Build Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Release Build
    if: github.event_name != 'push' || github.event.head_commit.message != 'Update docs'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-sdl3-freetype-pcre2-v1

      - name: Install system dependencies
        run: |
          choco install pkgconfiglite -y
          $maxRetries = 3
          for ($i = 1; $i -le $maxRetries; $i++) {
            vcpkg install sdl3:x64-windows freetype:x64-windows pcre2:x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -lt $maxRetries) {
              Write-Host "vcpkg install attempt $i failed, retrying in 15s…"
              Start-Sleep -Seconds 15
            } else {
              throw "vcpkg install failed after $maxRetries attempts"
            }
          }
          echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.job }}-crt2-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'cmake/static-crt.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-crt2-

      - name: Build release
        shell: pwsh
        run: cargo build --release --all-features

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: JereIDE-windows
          path: target/release/JereIDE.exe

  build-macos:
    name: macOS Release Build
    if: github.event_name != 'push' || github.event.head_commit.message != 'Update docs'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: brew install sdl3 freetype pcre2

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-

      - name: Build release
        run: cargo build --release --all-features

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: JereIDE-macos
          path: target/release/JereIDE
