name: Deploy Docs to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      - name: Build wiki
        run: |
          mdbook build docs
          mkdir -p deploy/docs
          mv docs/book/* deploy/docs/

      - name: Publish docs to jereide.github.io/docs
        env:
          DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/JereIDE/jereide.github.io.git" \
            /tmp/site
          rm -rf /tmp/site/docs
          cp -r deploy/docs /tmp/site/docs
          cd /tmp/site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # /docs/ is gitignored in the user-site repo; force-add to bypass it.
          git add -f docs
          if git diff --cached --quiet; then
            echo "No docs changes; nothing to push."
          else
            git commit -m "deploy docs: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push origin main
          fi
