name: Deploy Docs to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Cheap check that runs on every push: builds docs only when the commit
  # message is "Update docs" OR a file under docs/ changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$COMMIT_MSG" == "Update docs" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(echo "$COMMITS_JSON" | jq '[.[].added[], .[].modified[], .[].removed[]] | map(select(startswith("docs/"))) | length')
          if [[ "$CHANGED" -gt 0 ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      - name: Build wiki
        run: |
          mdbook build docs
          mkdir -p deploy/docs
          mv docs/book/* deploy/docs/

      - name: Publish docs to jereide.github.io/docs
        env:
          DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/JereIDE/jereide.github.io.git" \
            /tmp/site
          rm -rf /tmp/site/docs
          cp -r deploy/docs /tmp/site/docs
          cd /tmp/site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # /docs/ is gitignored in the user-site repo; force-add to bypass it.
          git add -f docs
          if git diff --cached --quiet; then
            echo "No docs changes; nothing to push."
          else
            git commit -m "deploy docs: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push origin main
          fi
