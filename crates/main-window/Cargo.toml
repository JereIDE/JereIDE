[package]
name = "jereide-main-window"
version.workspace = true
edition = "2021"

[dependencies]
eframe = "0.34"
jereide-core = { path = "../core" }
jereide-settings = { path = "../settings" }
jereide-fs = { path = "../fs" }
jereide-menu = { path = "../menu" }
jereide-ui = { path = "../ui" }
jereide-code = { path = "../code" }
jereide-compose = { path = "../compose" }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
